name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        working-directory: .
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Bundle the current site as the offline copy
        run: |
          mkdir -p app/src/main/assets
          cp ../index.html ../style.css ../app.js ../logo.svg app/src/main/assets/
          cp -r ../fonts app/src/main/assets/fonts
          cp -r ../data app/src/main/assets/data
          du -sh app/src/main/assets
      - name: Set the version (always higher than the last build)
        run: |
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=2.2.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Signing key (permanent key from repository secrets, so phones can update in place)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEY_KIND=permanent" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set. Using a temporary key, so phones must uninstall before installing."
            KS_PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -alias news -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PW" -keypass "$KS_PW" -dname "CN=Daily News Briefing"
            echo "KEY_KIND=temporary" >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$KS_PW"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=news" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
      - name: Build
        run: gradle assembleRelease
      - name: Name the file
        run: cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/DailyNewsBriefing.apk"
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Daily News Briefing app
          body: |
            Latest Android app, version ${{ env.VERSION_NAME }}. Download DailyNewsBriefing.apk and install it.
            Key: ${{ env.KEY_KIND }} (a permanent key lets the app update in place).
            versionCode: ${{ env.VERSION_CODE }}
          files: ${{ runner.temp }}/DailyNewsBriefing.apk
          make_latest: true
