name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Create a signing key for this build
        run: |
          PW=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias news -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=Daily News Briefing"
          echo "::add-mask::$PW"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=news" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
      - name: Build
        run: gradle assembleRelease
      - name: Name the file
        run: cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/DailyNewsBriefing.apk"
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Daily News Briefing app
          body: Latest Android app. Download DailyNewsBriefing.apk and install it.
          files: ${{ runner.temp }}/DailyNewsBriefing.apk
          make_latest: true
