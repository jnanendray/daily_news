name: Collect news
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to collect (1-30)'
        default: '3'
  schedule:
    - cron: '20 0 * * *'    # 05:50 India time
    - cron: '20 6 * * *'    # 11:50
    - cron: '20 12 * * *'   # 17:50
    - cron: '50 17 * * *'   # 23:20
permissions:
  contents: write
concurrency:
  group: collect-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect headlines (GDELT index of Indian and Karnataka news sites)
        run: python3 tools/collect.py --days "${{ github.event.inputs.days || '3' }}"
      - name: Commit changes
        run: |
          git config user.name "news-collector"
          git config user.email "news-collector@users.noreply.github.com"
          git add data/live
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Collect headlines $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
